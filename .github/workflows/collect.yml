name: Collect private price history

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional product limit for an authorized smoke collection"
        required: false
        type: string
  # schedule:
  #   - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public code
        uses: actions/checkout@v4

      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: DEM0NISH/what-percent-data
          ref: data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Verify private debug ignore rule
        run: git -C data-repo check-ignore debug/

      - name: Build collector image
        run: docker build -t what-percent .

      - name: Collect prices
        id: collect
        continue-on-error: true
        env:
          WHATPCT_REPO_URL: ${{ vars.WHATPCT_REPO_URL }}
          WHATPCT_CONTACT_EMAIL: ${{ vars.WHATPCT_CONTACT_EMAIL }}
          COLLECT_LIMIT: ${{ inputs.limit }}
        run: |
          set +e
          args=()
          if [[ -n "$COLLECT_LIMIT" ]]; then args+=(--limit "$COLLECT_LIMIT"); fi
          docker run --rm \
            -e WHATPCT_REPO_URL \
            -e WHATPCT_CONTACT_EMAIL \
            -e WHATPCT_DATA=/data \
            -v "$GITHUB_WORKSPACE/data-repo:/data" \
            what-percent collect "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save durable CSV data to the private repository
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          set -euo pipefail
          git -C data-repo config user.name "github-actions[bot]"
          git -C data-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data-repo add -- snapshots runs.csv spotchecks.csv skeletons.json
          if git -C data-repo diff --cached --quiet; then
            exit 0
          fi
          git -C data-repo commit -m "data: $(date -u +%F)"
          for attempt in 1 2 3; do
            if git -C data-repo push origin HEAD:data; then
              exit 0
            fi
            git -C data-repo fetch origin data
            git -C data-repo rebase origin/data || git -C data-repo rebase --abort
          done
          echo "Could not update the private data branch after three attempts." >&2
          exit 1

      - name: Propagate collector exit code
        if: always()
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
        run: |
          if [[ -z "$COLLECT_EXIT_CODE" ]]; then
            echo "Collector did not produce an exit code (for example, the image build failed)." >&2
            exit 1
          fi
          if [[ "$COLLECT_EXIT_CODE" != "0" ]]; then
            exit "$COLLECT_EXIT_CODE"
          fi

      - name: Upload private debug snippets on suspect or failed run
        if: always() && (failure() || steps.collect.outputs.exit_code != '0')
        uses: actions/upload-artifact@v4
        with:
          name: collect-debug-${{ github.run_id }}
          path: data-repo/debug/
          if-no-files-found: ignore
          retention-days: 7


