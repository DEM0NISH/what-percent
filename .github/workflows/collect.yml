name: Collect private price history

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public code
        uses: actions/checkout@v4

      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WHATPCT_DATA_REPOSITORY }}
          ref: data
          token: ${{ secrets.WHATPCT_DATA_REPO_TOKEN }}
          path: private-data

      - name: Build collector image
        run: docker build -t what-percent .

      - name: Collect prices
        id: collect
        env:
          WHATPCT_REPO_URL: ${{ vars.WHATPCT_REPO_URL }}
          WHATPCT_CONTACT_EMAIL: ${{ vars.WHATPCT_CONTACT_EMAIL }}
        run: |
          set +e
          docker run --rm \
            -e WHATPCT_REPO_URL \
            -e WHATPCT_CONTACT_EMAIL \
            -e WHATPCT_DATA=/data \
            -v "$GITHUB_WORKSPACE/private-data:/data" \
            what-percent collect
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save durable CSV data to the private repository
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          set -euo pipefail
          git -C private-data config user.name "github-actions[bot]"
          git -C private-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C private-data add -- snapshots runs.csv spotchecks.csv skeletons.json
          if git -C private-data diff --cached --quiet; then
            exit 0
          fi
          git -C private-data commit -m "data: $(date -u +%F)"
          for attempt in 1 2 3; do
            if git -C private-data push origin HEAD:data; then
              exit 0
            fi
            git -C private-data fetch origin data
            git -C private-data rebase origin/data || git -C private-data rebase --abort
          done
          echo "Could not update the private data branch after three attempts." >&2
          exit 1

      - name: Propagate collector exit code
        if: always()
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
        run: |
          if [[ -z "$COLLECT_EXIT_CODE" ]]; then
            echo "Collector did not produce an exit code (for example, the image build failed)." >&2
            exit 1
          fi
          if [[ "$COLLECT_EXIT_CODE" != "0" ]]; then
            exit "$COLLECT_EXIT_CODE"
          fi


